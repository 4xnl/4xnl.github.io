<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>4xnl · Themen & Projekte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Cormorant+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root,
  [data-theme="light"] {
    --ink: #1a1a1a;
    --paper: #f5f1e8;
    --cinnabar: #b03a2e;
    --muted: #6b6459;
    --line: rgba(26,26,26,0.12);
    --glow-1: rgba(176,58,46,0.04);
    --glow-2: rgba(26,26,26,0.05);
  }

  [data-theme="dark"] {
    --ink: #e8e2d4;
    --paper: #14120e;
    --cinnabar: #d95a4a;
    --muted: #8a8274;
    --line: rgba(232,226,212,0.14);
    --glow-1: rgba(217,90,74,0.07);
    --glow-2: rgba(232,226,212,0.04);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Cormorant Garamond', serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
    transition: background 0.5s ease, color 0.5s ease;
  }

  body {
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 15% 20%, var(--glow-1), transparent 45%),
      radial-gradient(circle at 85% 80%, var(--glow-2), transparent 50%);
    background-attachment: fixed;
    transition: background-image 0.5s ease;
  }

  /* Vertikale Seitenleiste */
  .side {
    position: fixed;
    left: 2rem;
    top: 50%;
    transform: translateY(-50%) rotate(180deg);
    writing-mode: vertical-rl;
    font-family: 'Cormorant SC', serif;
    letter-spacing: 0.6em;
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    transition: color 0.5s ease;
  }

  /* Rotes Siegel (unten rechts) */
  .seal {
    position: fixed;
    top: 2rem;
    right: 2rem;
    width: 56px;
    height: 56px;
    background: var(--cinnabar);
    color: var(--paper);
    font-family: 'Cormorant SC', serif;
    font-weight: 500;
    display: grid;
    place-items: center;
    font-size: 1.6rem;
    line-height: 1;
    box-shadow: 0 2px 20px rgba(176,58,46,0.25);
    border-radius: 2px;
    transition: background 0.5s ease, color 0.5s ease;
  }

  /* Motiv-Umschalter (oben links) */
  .theme-toggle {
    position: fixed;
    top: 2rem;
    left: 2rem;
    width: 44px;
    height: 44px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    border-radius: 50%;
    cursor: pointer;
    display: grid;
    place-items: center;
    font-size: 1rem;
    transition: color 0.3s, border-color 0.3s, transform 0.4s ease;
    z-index: 10;
  }
  .theme-toggle:hover {
    color: var(--cinnabar);
    border-color: var(--cinnabar);
    transform: rotate(180deg);
  }
  .theme-toggle svg { display: block; }

  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 7rem 2rem 6rem;
  }

  header {
    text-align: center;
    margin-bottom: 5rem;
    position: relative;
  }

  .avatar-wrap {
    display: inline-block;
    position: relative;
    margin-bottom: 2rem;
  }
  .avatar-wrap::before,
  .avatar-wrap::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 1px solid var(--ink);
    opacity: 0.15;
    transition: border-color 0.5s ease;
  }
  .avatar-wrap::before { top: -8px; left: -8px; }
  .avatar-wrap::after  { bottom: -8px; right: -8px; border-color: var(--cinnabar); opacity: 0.3; }

  .avatar {
    width: 128px;
    height: 128px;
    border-radius: 50%;
    display: block;
    object-fit: cover;
    filter: grayscale(100%) contrast(1.05);
    transition: filter 0.6s ease;
    border: 1px solid var(--line);
  }
  .avatar:hover { filter: grayscale(0%) contrast(1); }

  h1 {
    font-family: 'Cormorant SC', serif;
    font-weight: 500;
    font-size: clamp(1.8rem, 4.5vw, 2.6rem);
    letter-spacing: 0.35em;
    text-indent: 0.35em;
    margin-bottom: 0.75rem;
    text-transform: uppercase;
    transition: color 0.5s ease;
  }

  .handle {
    font-style: italic;
    font-size: 1.05rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    transition: color 0.5s ease;
  }
  .handle a {
    color: var(--cinnabar);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.3s;
  }
  .handle a:hover { border-color: var(--cinnabar); }

  .bio {
    margin-top: 1.5rem;
    max-width: 42ch;
    margin-left: auto;
    margin-right: auto;
    font-style: italic;
    color: var(--muted);
    transition: color 0.5s ease;
  }

  header::after {
    content: "";
    display: block;
    width: 1px;
    height: 4rem;
    background: linear-gradient(to bottom, var(--ink), transparent);
    margin: 3rem auto 0;
    transition: background 0.5s ease;
  }

  .section { margin-bottom: 5rem; }
  .section:last-of-type { margin-bottom: 0; }

  .section-title {
    text-align: center;
    font-family: 'Cormorant SC', serif;
    font-weight: 500;
    font-size: 0.75rem;
    letter-spacing: 0.7em;
    text-indent: 0.7em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 2.5rem;
    transition: color 0.5s ease;
  }
  .section-title::after {
    content: "";
    display: block;
    width: 24px;
    height: 1px;
    background: var(--cinnabar);
    margin: 1.2rem auto 0;
    transition: background 0.5s ease;
  }

  .list { display: grid; gap: 0; }

  .item {
    display: block;
    padding: 1.9rem 0;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    color: inherit;
    position: relative;
    transition: padding 0.4s ease, border-color 0.5s ease;
  }
  .item:first-child { border-top: 1px solid var(--line); }

  .item::before {
    content: "→";
    position: absolute;
    left: -2rem;
    top: 2.1rem;
    color: var(--cinnabar);
    opacity: 0;
    transition: all 0.4s ease;
  }
  .item:hover { padding-left: 1rem; }
  .item:hover::before { left: -1rem; opacity: 1; }

  .item-title {
    font-family: 'Cormorant SC', serif;
    font-weight: 500;
    font-size: 1.25rem;
    letter-spacing: 0.05em;
    margin-bottom: 0.35rem;
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .item-title .type {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 0.82rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: none;
    transition: color 0.5s ease;
  }

  .item-desc {
    font-size: 0.98rem;
    color: var(--muted);
    font-style: italic;
    max-width: 60ch;
    transition: color 0.5s ease;
  }

  .item-meta {
    margin-top: 0.6rem;
    font-size: 0.72rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: 'Cormorant SC', serif;
    font-weight: 400;
    transition: color 0.5s ease;
  }
  .item-meta span + span::before {
    content: "·";
    margin: 0 0.7rem;
    color: var(--cinnabar);
  }

  .author-link {
    display: block;
    text-align: center;
    margin-top: 2rem;
    font-family: 'Cormorant SC', serif;
    font-size: 0.75rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--cinnabar);
    text-decoration: none;
    padding: 0.9rem 1rem;
    border: 1px solid var(--cinnabar);
    transition: background 0.3s, color 0.3s;
  }
  .author-link:hover {
    background: var(--cinnabar);
    color: var(--paper);
  }

  .loading, .error, .empty {
    text-align: center;
    padding: 3.5rem 0;
    color: var(--muted);
    font-style: italic;
    letter-spacing: 0.2em;
    transition: color 0.5s ease;
  }

  footer {
    margin-top: 6rem;
    text-align: center;
    font-size: 0.72rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: 'Cormorant SC', serif;
    font-weight: 400;
    transition: color 0.5s ease;
  }
  footer::before {
    content: "◯";
    display: block;
    margin-bottom: 1.5rem;
    font-size: 1.2rem;
    color: var(--cinnabar);
    letter-spacing: 0;
  }

  @media (max-width: 640px) {
    .side { display: none; }
    .seal { width: 44px; height: 44px; font-size: 1.3rem; top: 1rem; right: 1rem; }
    .theme-toggle { top: 1rem; left: 1rem; width: 40px; height: 40px; }
    main { padding: 5rem 1.5rem 3rem; }
    header { margin-bottom: 3.5rem; }
    h1 { letter-spacing: 0.2em; text-indent: 0.2em; }
    .avatar { width: 104px; height: 104px; }
  }
</style>
</head>
<body data-theme="light">

  <!-- Motiv-Umschalter -->
  <button id="themeToggle" class="theme-toggle" aria-label="Motiv wechseln" title="Motiv wechseln">
    <svg id="iconMoon" width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </svg>
    <svg id="iconSun" width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
         style="display:none;">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
  </button>

  <div class="seal">四</div>
  <div class="side">Themen · Projekte · 4xnl</div>

  <main>
    <header>
      <div class="avatar-wrap">
        <img id="avatar" class="avatar"
             src="https://github.com/4xnl.png"
             alt="Profilbild von 4xnl" />
      </div>
      <h1 id="name">4xnl</h1>
      <p class="handle">
        <a href="https://github.com/4xnl" target="_blank" rel="noopener">github.com/4xnl</a>
      </p>
      <p class="bio" id="bio"></p>
    </header>

    <!-- Themen -->
    <section class="section">
      <h2 class="section-title">Meine Themen</h2>
      <div class="list" id="themes">
        <div class="loading">— Wird geladen —</div>
      </div>
      <a class="author-link"
         href="https://www.cubiclauncher.org/themes/author/4xnl"
         target="_blank" rel="noopener">
        Alle Themen auf CubicLauncher ansehen
      </a>
    </section>

    <!-- Projekte -->
    <section class="section">
      <h2 class="section-title">Meine Projekte</h2>
      <div class="list" id="projects">
        <div class="loading">— Wird geladen —</div>
      </div>
    </section>

    <footer>4xnl · Alle Rechte vorbehalten</footer>
  </main>

<script>
  const USERNAME     = '4xnl';
  const THEMES_REPO  = 'Themes';
  const THEMES_PATH  = 'src/4xnl';
  const CUBIC_BASE   = 'https://www.cubiclauncher.org/themes/';
  const CUBIC_PREFIX = '4xnl-';

  const themesEl   = document.getElementById('themes');
  const projectsEl = document.getElementById('projects');

  /* ---------- Motiv-Umschalter ---------- */
  const themeToggle = document.getElementById('themeToggle');
  const iconMoon    = document.getElementById('iconMoon');
  const iconSun     = document.getElementById('iconSun');

  function motivSetzen(modus) {
    document.body.setAttribute('data-theme', modus);
    // Sonne zeigen, wenn dunkel aktiv, sonst Mond
    iconMoon.style.display = modus === 'dark' ? 'none' : 'block';
    iconSun.style.display  = modus === 'dark' ? 'block' : 'none';
    try { localStorage.setItem('4xnl-theme', modus); } catch (_) {}
  }

  // Gespeichertes Motiv laden, sonst Systemeinstellung verwenden
  (function initMotiv() {
    let gespeichert = null;
    try { gespeichert = localStorage.getItem('4xnl-theme'); } catch (_) {}
    if (gespeichert === 'light' || gespeichert === 'dark') {
      motivSetzen(gespeichert);
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      motivSetzen('dark');
    } else {
      motivSetzen('light');
    }
  })();

  themeToggle.addEventListener('click', () => {
    const aktuell = document.body.getAttribute('data-theme');
    motivSetzen(aktuell === 'dark' ? 'light' : 'dark');
  });

  /* ---------- Hilfsfunktionen ---------- */
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function formatiereDatum(iso) {
    try {
      return new Date(iso).toLocaleDateString('de-DE', {
        year: 'numeric', month: 'short'
      });
    } catch (_) { return ''; }
  }

  function zuSlug(name) {
    return String(name)
      .trim()
      .replace(/_+/g, '-')
      .replace(/\s+/g, '-')
      .toLowerCase();
  }

  function schoenenThemenNamen(slug) {
    return slug
      .split(/[-_]+/)
      .filter(Boolean)
      .map(w => w.charAt(0).toUpperCase() + w.slice(1))
      .join(' ');
  }

  /* ---------- Profildaten ---------- */
  async function loadProfile() {
    try {
      const res = await fetch(`https://api.github.com/users/${USERNAME}`);
      if (!res.ok) return;
      const u = await res.json();
      if (u.name) document.getElementById('name').textContent = u.name;
      if (u.bio)  document.getElementById('bio').textContent  = u.bio;
      if (u.avatar_url) {
        document.getElementById('avatar').src = u.avatar_url + '?v=' + Date.now();
      }
    } catch (_) { /* still */ }
  }

  /* ---------- Themen ---------- */
  async function loadThemes() {
    try {
      const res = await fetch(
        `https://api.github.com/repos/${USERNAME}/${THEMES_REPO}/contents/${THEMES_PATH}`
      );
      if (!res.ok) throw new Error('Ordner konnte nicht geladen werden');
      const items = await res.json();

      if (!Array.isArray(items) || !items.length) {
        themesEl.innerHTML =
          '<div class="empty">Noch keine Themen vorhanden.</div>';
        return;
      }

      const themes = items
        .filter(i => i.type === 'dir')
        .sort((a, b) => a.name.localeCompare(b.name, 'de'));

      if (!themes.length) {
        themesEl.innerHTML =
          '<div class="empty">Noch keine Themen vorhanden.</div>';
        return;
      }

      themesEl.innerHTML = themes.map(t => {
        const slug     = zuSlug(t.name);
        const cubicUrl = `${CUBIC_BASE}${CUBIC_PREFIX}${slug}`;
        return `
          <a class="item" href="${cubicUrl}" target="_blank" rel="noopener">
            <div class="item-title">
              ${escapeHtml(schoenenThemenNamen(slug))}
              <span class="type">Thema</span>
            </div>
            <div class="item-meta">
              <span>Auf CubicLauncher ansehen</span>
            </div>
          </a>
        `;
      }).join('');
    } catch (err) {
      themesEl.innerHTML =
        `<div class="error">Die Themen konnten leider nicht geladen werden.<br>
         <small>${escapeHtml(err.message)}</small></div>`;
    }
  }

  /* ---------- Projekte ---------- */
  async function loadProjects() {
    try {
      const res = await fetch(
        `https://api.github.com/users/${USERNAME}/repos?sort=updated&per_page=100`
      );
      if (!res.ok) throw new Error('Projekte konnten nicht geladen werden');
      let repos = await res.json();

      repos = repos.filter(r => !r.fork);

      if (!repos.length) {
        projectsEl.innerHTML =
          '<div class="empty">Noch keine Projekte vorhanden.</div>';
        return;
      }

      projectsEl.innerHTML = repos.map(r => `
        <a class="item" href="${r.html_url}" target="_blank" rel="noopener">
          <div class="item-title">
            ${escapeHtml(r.name)}
            ${r.language ? `<span class="type">${escapeHtml(r.language)}</span>` : ''}
          </div>
          <div class="item-desc">
            ${r.description ? escapeHtml(r.description) : '<em>Keine Beschreibung vorhanden.</em>'}
          </div>
          <div class="item-meta">
            <span>★ ${r.stargazers_count}</span>
            <span>⑂ ${r.forks_count}</span>
            <span>Zuletzt aktualisiert: ${formatiereDatum(r.updated_at)}</span>
          </div>
        </a>
      `).join('');
    } catch (err) {
      projectsEl.innerHTML =
        `<div class="error">Die Projekte konnten leider nicht geladen werden.<br>
         <small>${escapeHtml(err.message)}</small></div>`;
    }
  }

  loadProfile();
  loadThemes();
  loadProjects();
</script>
</body>
</html>
